<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us — Rainbow Tree Consultancy</title>
  <meta name="description" content="Contact Rainbow Tree Consultancy — David Bidwell, consulting arborist, Coogee NSW.">
  <link rel="icon" href="images/cropped-icon.jpg">
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="inner">

  <header class="site-header">
    <div class="site-branding wrap">
      <p class="site-title"><a href="index.html">Rainbow Tree Consultancy</a></p>
      <p class="site-tagline">Proprietor David Bidwell — Consulting Arborist</p>
    </div>
  </header>

  <nav class="site-nav">
    <ul class="wrap">
      <li><a href="index.html">Welcome</a></li>
      <li><a href="about-us.html">About Us</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="contact-us.html" aria-current="page">Contact Us</a></li>
    </ul>
  </nav>

  <div class="page-banner">
    <img src="images/contact-us/fruit-tree.webp" alt="">
  </div>

  <main class="page-main">
    <div class="wrap page-layout">
      <header>
        <h1 class="page-title">Contact Us</h1>
      </header>
      <div class="page-content">

        <div class="contact-details">
          <p>Email: <a href="mailto:david@rainbowtrees.com.au">david@rainbowtrees.com.au</a></p>
          <p>Phone: 0400 312 246</p>
          <p>Address: 298 Rainbow Street, Coogee NSW 2014</p>
          <p><strong>ABN:</strong> 14 463 001 466</p>
        </div>

        <form class="contact-form">
          <div class="field">
            <label for="name">Name <span>(required)</span></label>
            <input type="text" id="name" name="name">
          </div>
          <div class="field">
            <label for="email">Email <span>(required)</span></label>
            <input type="email" id="email" name="email">
          </div>
          <div class="field">
            <label for="comment">Comment <span>(required)</span></label>
            <textarea id="comment" name="comment" rows="8"></textarea>
          </div>
          <div class="field" style="position:absolute; left:-9999px;" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
          </div>
          <button type="button" class="contact-button">Submit</button>
          <p id="contact-status" role="status" aria-live="polite"></p>
        </form>

      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <img class="footer-mark" src="images/footer1b.webp" alt="Rainbow Tree Consultancy">
      <img class="footer-wordmark" src="images/footer2c.webp" alt="">
    </div>
  </footer>

  <script>
    const form = document.querySelector(".contact-form");
    const button = form.querySelector(".contact-button");
    const status = document.getElementById("contact-status");

    button.addEventListener("click", async () => {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const comment = document.getElementById("comment").value.trim();
      const website = document.getElementById("website").value.trim(); // honeypot

      if (!name || !email || !comment) {
        status.textContent = "Please fill in your name, email, and comment.";
        return;
      }

      button.disabled = true;
      status.textContent = "Sending...";

      const data = new FormData();
      data.append("name", name);
      data.append("email", email);
      data.append("comment", comment);
      data.append("website", website);

      try {
        const res = await fetch("https://contact.rainbowtrees.com.au/send.php", {
          method: "POST",
          body: data,
        });
        const result = await res.json();
        status.textContent = result.success
          ? "Thanks — your message has been sent!"
          : (result.error || "Something went wrong. Please try again.");
        if (result.success) form.reset();
      } catch {
        status.textContent = "Something went wrong. Please check your connection and try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>

</body>
</html>
